<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Support Västberga</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  :root {
    --bg:   #4ADE80;
    --ink:  #04331D;
    --soft: rgba(4,51,29,.55);
    --line: rgba(4,51,29,.16);
  }

  body.borta {
    --bg:   #FF5C47;
    --ink:  #3D0B03;
    --soft: rgba(61,11,3,.55);
    --line: rgba(61,11,3,.16);
  }

  body {
    width:100vw; height:100vh; overflow:hidden;
    background:var(--bg); color:var(--ink);
    font-family:"Segoe UI", Roboto, Helvetica, Arial, system-ui, sans-serif;
    transition:background-color .45s ease, color .45s ease;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:6vh 5vw;
    user-select:none;
  }

  header { display:flex; align-items:center; gap:1.6vw; }

  .mark {
    width:6vh; height:6vh; flex:none;
    border:.55vh solid var(--ink);
    border-radius:1.4vh;
    position:relative;
  }
  .mark::after {
    content:""; position:absolute;
    left:22%; top:22%; width:56%; height:56%;
    background:var(--ink); border-radius:.5vh;
  }

  .avd   { font-size:3.2vh; font-weight:700; letter-spacing:-.01em; line-height:1.15; }
  .plats { font-size:2.6vh; font-weight:400; color:var(--soft); line-height:1.15; }

  .namn { display:flex; flex-direction:column; gap:.4vh; }
  .namn div {
    font-size:10vh; font-weight:800;
    letter-spacing:-.035em; line-height:1.04;
  }

  footer {
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:3vw; padding-top:3vh; border-top:1px solid var(--line);
  }

  .vanster { display:flex; flex-direction:column; gap:1.4vh; align-items:flex-start; }

  .status {
    display:inline-flex; align-items:center; gap:1.2vh;
    background:#fff; color:var(--ink);
    padding:1.3vh 2.4vh; border-radius:99px;
    font-size:3vh; font-weight:600; letter-spacing:-.01em;
    transition:color .45s ease;
  }
  .prick {
    width:1.6vh; height:1.6vh; border-radius:50%;
    background:var(--bg);
    transition:background-color .45s ease;
  }

  .tid { font-size:2.7vh; color:var(--soft); font-weight:400; }

  button {
    font:inherit; font-size:2.6vh; font-weight:600;
    color:var(--ink); background:transparent;
    border:.35vh solid var(--ink); border-radius:99px;
    padding:1.6vh 3vh; cursor:pointer;
    transition:background-color .15s ease, color .15s ease;
  }
  button:active { background:var(--ink); color:var(--bg); }
  button:focus-visible { outline:.4vh solid var(--ink); outline-offset:.6vh; }

  #panik {
    position:fixed; inset:0; z-index:9;
    background:#0B0F0C; color:#7CFFB2;
    font-family:"Courier New", monospace;
    font-size:2.9vh; line-height:1.9;
    padding:8vh 6vw;
    opacity:0; pointer-events:none;
    transition:opacity .3s ease;
    white-space:pre;
  }
  #panik.pa { opacity:1; }

  @media (prefers-reduced-motion:reduce) {
    * { transition:none !important; }
  }
</style>
</head>
<body>

  <header>
    <div class="mark" id="mark"></div>
    <div>
      <div class="avd">IT Support</div>
      <div class="plats">Västberga</div>
    </div>
  </header>

  <div class="namn">
    <div>Joel Nilsson</div>
    <div>Isak Söderström</div>
  </div>

  <footer>
    <div class="vanster">
      <div class="status"><span class="prick"></span><span id="statustext">På plats</span></div>
      <div class="tid">Mån–fre 07.15–16.45</div>
    </div>
    <button id="knapp">Sätt till borta</button>
  </footer>

  <div id="panik"></div>

<script>
const NYCKEL = "skylt-status";

function idag() {
  return new Date().toDateString();
}

function las() {
  try {
    const r = JSON.parse(localStorage.getItem(NYCKEL));
    if (r && r.dag === idag()) return r.borta;
  } catch (e) {}
  return false;
}

function spara(borta) {
  try {
    localStorage.setItem(NYCKEL, JSON.stringify({ borta: borta, dag: idag() }));
  } catch (e) {}
}

function satt(borta) {
  document.body.classList.toggle("borta", borta);
  document.getElementById("statustext").textContent = borta ? "Inte på plats" : "På plats";
  document.getElementById("knapp").textContent = borta ? "Sätt till på plats" : "Sätt till borta";
  spara(borta);
}

document.getElementById("knapp").addEventListener("click", function () {
  satt(!document.body.classList.contains("borta"));
});

const RADER = [
  "Vastberga IT — recovery console",
  "",
  "> kontrollerar kaffeniva ............ KRITISKT LAG",
  "> startar om Joel ................... OK",
  "> startar om Isak ................... OK",
  "> letar efter dokumentationen ....... TIMEOUT",
  "",
  "Har du provat att stanga av den och satta pa den igen?"
];

let tryck = 0, timer = null;

document.getElementById("mark").addEventListener("click", function () {
  clearTimeout(timer);
  tryck++;
  timer = setTimeout(function () { tryck = 0; }, 1200);
  if (tryck < 5) return;
  tryck = 0;

  const p = document.getElementById("panik");
  p.textContent = "";
  p.classList.add("pa");

  let i = 0;
  const skriv = setInterval(function () {
    p.textContent += RADER[i] + "\n";
    if (++i >= RADER.length) {
      clearInterval(skriv);
      setTimeout(function () { p.classList.remove("pa"); }, 3200);
    }
  }, 260);
});

satt(las());

setInterval(function () {
  if (document.body.classList.contains("borta") && !las()) satt(false);
}, 60000);
</script>

</body>
</html>
